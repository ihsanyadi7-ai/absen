<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Absensi TIKOM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Sidebar -->
<button class="btn-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
  <i class="bi bi-list"></i>
</button>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/images/mas.png" alt="Logo TIKOM">
    <div>
      <h6>ABSENSI TIKOM</h6>
      <small>MAS Darussholihin NW</small>
    </div>
  </div>
  <nav class="nav flex-column mt-3">
    <a class="nav-link active" href="home.html"><i class="bi bi-house-door me-2"></i> Home</a>
    <a class="nav-link" href="scan.html"><i class="bi bi-qr-code-scan me-2"></i> Scan Absensi</a>
    <a class="nav-link" href="database-siswa.html"><i class="bi bi-people me-2"></i> Database Siswa</a>
    <a class="nav-link" href="kartu-barcode.html"><i class="bi bi-credit-card-2-front me-2"></i> Kartu Barcode</a>
    <a class="nav-link" href="riwayat-absensi.html"><i class="bi bi-clock-history me-2"></i> Riwayat Absen</a>
  </nav>
</aside>

<!-- Main -->
<main class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0">Dashboard</h3>
      <small class="text-muted" id="tglHariIni"></small>
    </div>
    <div class="text-end">
      <div class="fw-semibold">Admin TIKOM</div>
      <small class="text-muted" id="jamSekarang"></small>
    </div>
  </div>

  <!-- Statistik -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card bg-1">
        <p>Total Siswa</p>
        <h3 id="totalSiswa">0</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card bg-2">
        <p>Hadir Hari Ini</p>
        <h3 id="hadirHariIni">0</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card bg-3">
        <p>Terlambat</p>
        <h3 id="totalTerlambat">0</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card bg-4">
        <p>Belum Absen</p>
        <h3 id="belumAbsen">0</h3>
      </div>
    </div>
  </div>

  <!-- Tombol Cepat -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <a href="scan.html" class="btn btn-primary w-100 py-3 rounded-3">
        <i class="bi bi-qr-code-scan d-block fs-3 mb-1"></i> Scan Barcode
      </a>
    </div>
    <div class="col-6 col-md-3">
      <a href="scan.html#wajah" class="btn btn-success w-100 py-3 rounded-3">
        <i class="bi bi-person-bounding-box d-block fs-3 mb-1"></i> Scan Wajah
      </a>
    </div>
    <div class="col-6 col-md-3">
      <a href="database-siswa.html" class="btn btn-info text-white w-100 py-3 rounded-3">
        <i class="bi bi-people d-block fs-3 mb-1"></i> Database
      </a>
    </div>
    <div class="col-6 col-md-3">
      <a href="riwayat-absensi.html" class="btn btn-warning w-100 py-3 rounded-3">
        <i class="bi bi-clock-history d-block fs-3 mb-1"></i> Riwayat
      </a>
    </div>
  </div>

  <!-- Tabel Absensi Terbaru -->
  <div class="card card-custom">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h6 class="mb-0 fw-bold">Absensi Terbaru Hari Ini</h6>
      <button class="btn btn-sm btn-outline-primary" onclick="exportExcel()">
        <i class="bi bi-file-earmark-excel"></i> Export Excel
      </button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>No</th><th>Nama Siswa</th><th>Kelas</th>
              <th>Metode</th><th>Jam</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tabelAbsen"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // Jam & tanggal realtime
  function updateWaktu() {
    const now = new Date();
    document.getElementById('tglHariIni').textContent = now.toLocaleDateString('id-ID',
      { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    document.getElementById('jamSekarang').textContent = now.toLocaleTimeString('id-ID');
  }
  setInterval(updateWaktu, 1000); updateWaktu();

  // Statistik
  const siswa = JSON.parse(localStorage.getItem('siswaTIKOM') || '[]');
  const absen = JSON.parse(localStorage.getItem('absenTIKOM') || '[]');
  const today = new Date().toISOString().slice(0,10);
  const absenHariIni = absen.filter(a => a.tanggal === today);

  document.getElementById('totalSiswa').textContent = siswa.length;
  document.getElementById('hadirHariIni').textContent = absenHariIni.length;
  document.getElementById('totalTerlambat').textContent =
    absenHariIni.filter(a => a.status === 'Terlambat').length;
  document.getElementById('belumAbsen').textContent =
    Math.max(0, siswa.length - absenHariIni.length);

  // Tabel absen terbaru
  const tbody = document.getElementById('tabelAbsen');
  if (absenHariIni.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">
      Belum ada absensi hari ini</td></tr>`;
  } else {
    tbody.innerHTML = absenHariIni.slice(-8).reverse().map((a, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${a.nama}</td>
        <td>${a.kelas}</td>
        <td><span class="badge bg-secondary">${a.metode}</span></td>
        <td>${a.jam}</td>
        <td><span class="badge badge-${a.status === 'Hadir' ? 'hadir' :
          a.status === 'Terlambat' ? 'telat' : 'absen'}">${a.status}</span></td>
      </tr>`).join('');
  }

  // Export Excel
  function exportExcel() {
    if (absenHariIni.length === 0) return alert('Belum ada data untuk diexport.');
    const data = absenHariIni.map((a, i) => ({
      No: i+1, Tanggal: a.tanggal, NIS: a.nis, Nama: a.nama,
      Kelas: a.kelas, Metode: a.metode, Jam: a.jam, Status: a.status
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Absensi');
    XLSX.writeFile(wb, `Laporan_Absensi_TIKOM_${today}.xlsx`);
  }
</script>
</body>
</html>
