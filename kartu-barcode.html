<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Barcode — Absensi TIKOM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<button class="btn-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
  <i class="bi bi-list"></i>
</button>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/images/mas.png" alt="Logo TIKOM">
    <div><h6>ABSENSI TIKOM</h6><small>MAS Darussholihin NW</small></div>
  </div>
  <nav class="nav flex-column mt-3">
    <a class="nav-link" href="home.html"><i class="bi bi-house-door me-2"></i> Home</a>
    <a class="nav-link" href="scan.html"><i class="bi bi-qr-code-scan me-2"></i> Scan Absensi</a>
    <a class="nav-link" href="database-siswa.html"><i class="bi bi-people me-2"></i> Database Siswa</a>
    <a class="nav-link active" href="kartu-barcode.html"><i class="bi bi-credit-card-2-front me-2"></i> Kartu Barcode</a>
    <a class="nav-link" href="riwayat-absensi.html"><i class="bi bi-clock-history me-2"></i> Riwayat Absen</a>
  </nav>
</aside>

<main class="main-content">
  <h3 class="fw-bold mb-4">Kartu Barcode Siswa</h3>

  <div class="card card-custom mb-4">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label">Pilih Siswa</label>
          <select id="pilihSiswa" class="form-select" onchange="renderKartu()"></select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary w-100" onclick="cetakKartu()">
            <i class="bi bi-printer"></i> Cetak Kartu
          </button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-success w-100" onclick="cetakSemua()">
            <i class="bi bi-printer-fill"></i> Cetak Semua
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="areaKartu" class="d-flex flex-wrap gap-4"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/kartu.js"></script>
</body>
</html>
