<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Absen — Absensi TIKOM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<button class="btn-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
  <i class="bi bi-list"></i>
</button>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/images/mas.png" alt="Logo TIKOM">
    <div><h6>ABSENSI TIKOM</h6><small>MAS Darussholihin NW</small></div>
  </div>
  <nav class="nav flex-column mt-3">
    <a class="nav-link" href="home.html"><i class="bi bi-house-door me-2"></i> Home</a>
    <a class="nav-link" href="scan.html"><i class="bi bi-qr-code-scan me-2"></i> Scan Absensi</a>
    <a class="nav-link" href="database-siswa.html"><i class="bi bi-people me-2"></i> Database Siswa</a>
    <a class="nav-link" href="kartu-barcode.html"><i class="bi bi-credit-card-2-front me-2"></i> Kartu Barcode</a>
    <a class="nav-link active" href="riwayat-absensi.html"><i class="bi bi-clock-history me-2"></i> Riwayat Absen</a>
  </nav>
</aside>

<main class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Riwayat Absensi</h3>
    <button class="btn btn-success" onclick="exportRiwayat()">
      <i class="bi bi-file-earmark-excel"></i> Export Excel
    </button>
  </div>

  <div class="card card-custom mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" id="rCari" class="form-control" placeholder="Cari nama / NIS"
            oninput="renderRiwayat()">
        </div>
        <div class="col-md-3">
          <input type="date" id="rTanggal" class="form-control" onchange="renderRiwayat()">
        </div>
        <div class="col-md-3">
          <select id="rStatus" class="form-select" onchange="renderRiwayat()">
            <option value="">Semua Status</option>
            <option>Hadir</option><option>Terlambat</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-secondary w-100" onclick="resetFilter()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card card-custom">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>No</th><th>Tanggal</th><th>NIS</th><th>Nama Siswa</th>
            <th>Kelas</th><th>Metode</th><th>Jam</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="tbodyRiwayat"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/riwayat.js"></script>
</body>
</html>
