<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Absensi — Absensi TIKOM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<button class="btn-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
  <i class="bi bi-list"></i>
</button>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/images/mas.png" alt="Logo TIKOM">
    <div><h6>ABSENSI TIKOM</h6><small>MAS Darussholihin NW</small></div>
  </div>
  <nav class="nav flex-column mt-3">
    <a class="nav-link" href="home.html"><i class="bi bi-house-door me-2"></i> Home</a>
    <a class="nav-link active" href="scan.html"><i class="bi bi-qr-code-scan me-2"></i> Scan Absensi</a>
    <a class="nav-link" href="database-siswa.html"><i class="bi bi-people me-2"></i> Database Siswa</a>
    <a class="nav-link" href="kartu-barcode.html"><i class="bi bi-credit-card-2-front me-2"></i> Kartu Barcode</a>
    <a class="nav-link" href="riwayat-absensi.html"><i class="bi bi-clock-history me-2"></i> Riwayat Absen</a>
  </nav>
</aside>

<main class="main-content">
  <h3 class="fw-bold mb-3">Scan Absensi</h3>

  <ul class="nav nav-tabs mb-4" id="tabScan">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#barcode">
        <i class="bi bi-qr-code-scan me-1"></i> Scan Barcode
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#wajah">
        <i class="bi bi-person-bounding-box me-1"></i> Scan Wajah
      </button>
    </li>
  </ul>

  <div class="tab-content">
    <!-- Barcode -->
    <div class="tab-pane fade show active" id="barcode">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card card-custom p-3">
            <div class="scan-box" id="reader">
              <div class="text-white text-center">
                <i class="bi bi-camera-video fs-1"></i>
                <p class="mt-2">Kamera belum aktif</p>
              </div>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-primary" onclick="startScan()">
                <i class="bi bi-camera-video"></i> Aktifkan Kamera
              </button>
              <button class="btn btn-danger" onclick="stopScan()">
                <i class="bi bi-stop-circle"></i> Matikan
              </button>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card card-custom p-3">
            <h6 class="fw-bold mb-3">Hasil Scan</h6>
            <div id="hasilScan" class="text-center text-muted py-5">
              Arahkan kartu barcode ke kamera
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Wajah -->
    <div class="tab-pane fade" id="wajah">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card card-custom p-3">
            <div class="scan-box" id="videoWajah">
              <div class="text-white text-center">
                <i class="bi bi-person-bounding-box fs-1"></i>
                <p class="mt-2">Kamera wajah belum aktif</p>
              </div>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-success" onclick="startWajah()">
                <i class="bi bi-camera-video"></i> Aktifkan Kamera
              </button>
              <button class="btn btn-danger" onclick="stopWajah()">
                <i class="bi bi-stop-circle"></i> Matikan
              </button>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card card-custom p-3">
            <h6 class="fw-bold mb-3">Hasil Deteksi Wajah</h6>
            <div id="hasilWajah" class="text-center text-muted py-5">
              Posisikan wajah dalam kotak
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/scan.js"></script>
</body>
</html>
