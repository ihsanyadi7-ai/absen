<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Siswa — Absensi TIKOM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<button class="btn-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
  <i class="bi bi-list"></i>
</button>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/images/mas.png" alt="Logo TIKOM">
    <div><h6>ABSENSI TIKOM</h6><small>MAS Darussholihin NW</small></div>
  </div>
  <nav class="nav flex-column mt-3">
    <a class="nav-link" href="home.html"><i class="bi bi-house-door me-2"></i> Home</a>
    <a class="nav-link" href="scan.html"><i class="bi bi-qr-code-scan me-2"></i> Scan Absensi</a>
    <a class="nav-link active" href="database-siswa.html"><i class="bi bi-people me-2"></i> Database Siswa</a>
    <a class="nav-link" href="kartu-barcode.html"><i class="bi bi-credit-card-2-front me-2"></i> Kartu Barcode</a>
    <a class="nav-link" href="riwayat-absensi.html"><i class="bi bi-clock-history me-2"></i> Riwayat Absen</a>
  </nav>
</aside>

<main class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Database Siswa</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSiswa"
      onclick="resetForm()">
      <i class="bi bi-plus-circle"></i> Tambah Siswa
    </button>
  </div>

  <div class="card card-custom">
    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-6">
          <input type="text" id="cari" class="form-control" placeholder="Cari nama / NIS..."
            oninput="renderTabel()">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>No</th><th>NIS</th><th>Nama Siswa</th>
              <th>Kelas</th><th>Alamat</th><th>Barcode</th><th>Wajah</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodySiswa"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal Form -->
<div class="modal fade" id="modalSiswa" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold">Form Siswa</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f_id">
        <div class="mb-2"><label class="form-label">NIS</label>
          <input id="f_nis" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Nama Lengkap</label>
          <input id="f_nama" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Kelas</label>
          <input id="f_kelas" class="form-control" placeholder="X TIKOM" required></div>
        <div class="mb-2"><label class="form-label">Alamat</label>
          <input id="f_alamat" class="form-control"></div>
        <div class="mb-2"><label class="form-label">Kode Barcode</label>
          <input id="f_barcode" class="form-control" placeholder="TIKOM-XXX"></div>
        <div class="mb-2"><label class="form-label">Status Wajah</label>
          <select id="f_wajah" class="form-select">
            <option>Belum</option><option>Terdaftar</option>
          </select></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="simpanSiswa()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/database.js"></script>
</body>
</html>
